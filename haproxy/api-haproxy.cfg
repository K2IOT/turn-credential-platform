global
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout client 60s
    timeout connect 5s
    timeout server 60s
    timeout check 3s

frontend credential_api
    bind *:8080
    default_backend credential_apps

backend credential_apps
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    option redispatch 1
    default-server inter 2s fall 3 rise 2
    server app1 app1:8080 check
    server app2 app2:8080 check
    server app3 app3:8080 check
