name: CI

on:
  push:
    branches:
      - main
      - feat/production-ha-patroni
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

  ha-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production HA topology contract
        run: bash scripts/verify-ha.sh --static-only

      - name: Validate rendered Compose configuration
        run: docker compose -f docker-compose.prod.yml config -q

  ha-integration:
    needs:
      - test
      - ha-static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_SUPERUSER_PASSWORD: ci-postgres-secret
      REPLICATOR_PASSWORD: ci-replicator-secret
      POSTGRES_APP_DB: turncred
      POSTGRES_APP_USER: turncred
      POSTGRES_APP_PASSWORD: turncred
      TURN_ADMIN_API_KEY: dev-admin-key
      TURN_EXTERNAL_IP: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run production HA acceptance
        run: bash scripts/verify-ha.sh

      - name: Upload HA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ha-compose-diagnostics
          path: ha-compose.log
          if-no-files-found: warn
          retention-days: 7
