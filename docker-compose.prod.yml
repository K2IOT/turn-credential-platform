x-patroni-environment: &patroni-environment
  PATRONI_SCOPE: turncred-cluster
  PATRONI_NAMESPACE: /turncred/
  PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-ci-postgres-secret}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD:-ci-replicator-secret}
  POSTGRES_APP_DB: ${POSTGRES_APP_DB:-turncred}
  POSTGRES_APP_USER: ${POSTGRES_APP_USER:-turncred}
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-turncred}

x-patroni-common: &patroni-common
  build:
    context: ./patroni
  image: k2iot/turncred-patroni:16
  depends_on:
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  expose:
    - "5432"
    - "8008"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  restart: unless-stopped
  stop_grace_period: 30s

x-app-environment: &app-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://db-haproxy:5000/${POSTGRES_APP_DB:-turncred}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-turncred}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:-turncred}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  TURN_ADMIN_API_KEY: ${TURN_ADMIN_API_KEY:-dev-admin-key}
  TURN_PLATFORM_DOMAIN: ${TURN_PLATFORM_DOMAIN:-yourplatform.com}

x-app-common: &app-common
  build: .
  image: k2iot/turn-credential-platform:latest
  depends_on:
    db-haproxy:
      condition: service_started
    redis:
      condition: service_healthy
  environment: *app-environment
  expose:
    - "8080"
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 15s
  restart: unless-stopped

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=turncred-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd1data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=turncred-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd2data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  etcd3:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=turncred-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd3data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  pg1:
    <<: *patroni-common
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
    volumes:
      - pg1data:/var/lib/postgresql/data

  pg2:
    <<: *patroni-common
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
    volumes:
      - pg2data:/var/lib/postgresql/data

  pg3:
    <<: *patroni-common
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
    volumes:
      - pg3data:/var/lib/postgresql/data

  db-haproxy:
    image: haproxy:2.9
    depends_on:
      pg1:
        condition: service_healthy
      pg2:
        condition: service_healthy
      pg3:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "5000"
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.17.2-r0
    depends_on:
      db-haproxy:
        condition: service_started
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --psql-userdb=host=db-haproxy port=5000 dbname=${POSTGRES_APP_DB:-turncred} user=${POSTGRES_APP_USER:-turncred} password=${POSTGRES_APP_PASSWORD:-turncred} connect_timeout=10
    restart: unless-stopped

  app1:
    <<: *app-common

  app2:
    <<: *app-common

  app3:
    <<: *app-common

  api-haproxy:
    image: haproxy:2.9
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    volumes:
      - ./haproxy/api-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  etcd1data:
  etcd2data:
  etcd3data:
  pg1data:
  pg2data:
  pg3data:
  redisdata:
