services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      etcd --name etcd1
      --initial-advertise-peer-urls http://etcd1:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd1:2379
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
    restart: unless-stopped

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      etcd --name etcd2
      --initial-advertise-peer-urls http://etcd2:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd2:2379
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
    restart: unless-stopped

  etcd3:
    image: quay.io/coreos/etcd:v3.5.15
    command: >
      etcd --name etcd3
      --initial-advertise-peer-urls http://etcd3:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd3:2379
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new
    restart: unless-stopped

  pg1:
    image: zalando/patroni:v3.2.2
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      NODE_NAME: pg1
      NODE_IP: pg1
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-secret}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-secret}
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml
      - pg1data:/var/lib/postgresql/data
    restart: unless-stopped

  pg2:
    image: zalando/patroni:v3.2.2
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      NODE_NAME: pg2
      NODE_IP: pg2
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-secret}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-secret}
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml
      - pg2data:/var/lib/postgresql/data
    restart: unless-stopped

  pg3:
    image: zalando/patroni:v3.2.2
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      NODE_NAME: pg3
      NODE_IP: pg3
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-secret}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-secret}
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml
      - pg3data:/var/lib/postgresql/data
    restart: unless-stopped

  haproxy:
    image: haproxy:2.9
    depends_on: [pg1, pg2, pg3]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "5000:5000"
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    depends_on: [haproxy]
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped

  app:
    build: .
    image: k2iot/turn-credential-platform:latest
    depends_on: [haproxy, redis]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://haproxy:5000/turncred
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-turncred}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:-turncred}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    deploy:
      replicas: 3
    restart: unless-stopped

volumes:
  pg1data:
  pg2data:
  pg3data:
