listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
realm=e2e.turn.yourplatform.com

fingerprint
lt-cred-mech
use-auth-secret

# Production database access goes through HAProxy, which routes only to the current Patroni primary.
psql-userdb="host=db-haproxy port=5000 dbname=turncred user=turncred password=turncred connect_timeout=10"
userdb-user-secret-query="SELECT value FROM turn_secret WHERE realm = $1 AND (user_id IS NULL OR user_id = substring($2 from position(':' in $2) + 1)) AND (valid_until IS NULL OR valid_until > NOW())"

no-cli
no-tlsv1
no-tlsv1_1

log-file=stdout
verbose
