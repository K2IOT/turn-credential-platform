listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
realm=e2e.turn.yourplatform.com

fingerprint
use-auth-secret

# PostgreSQL connection settings are injected by docker-compose.prod.yml via --psql-userdb so
# deployment credentials remain fail-closed and are not embedded in this configuration file.
# Upstream Coturn's PostgreSQL driver loads shared secrets with:
#   SELECT value FROM turn_secret WHERE realm=$1
# Coturn does not support a userdb-user-secret-query override. Per-user/valid_until filtering is
# therefore not claimed or implemented by this HA deployment change.

# TURNS on 5349 additionally requires production cert/pkey mounts. This HA reference does not
# provision certificates; see README.md before enabling the TURNS URI in a real deployment.
no-cli

log-file=stdout
verbose
