listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=$TURN_EXTERNAL_IP

fingerprint
lt-cred-mech
use-auth-secret

# realm-based secret lookup — reads turn_secret_active view for active and grace-period secrets
psql-userdb="host=haproxy port=5000 dbname=turncred user=turncred password=turncred connect_timeout=10"
userdb-user-secret-query="SELECT value FROM turn_secret_active WHERE realm = $1"

no-cli
no-tlsv1
no-tlsv1_1
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/key.pem

log-file=stdout
verbose
