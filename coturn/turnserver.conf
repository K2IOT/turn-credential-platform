listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=$TURN_EXTERNAL_IP
realm=e2e.turn.yourplatform.com

fingerprint
lt-cred-mech
use-auth-secret

# realm-based secret lookup — queries turn_secret table for active (valid_until IS NULL) and grace-period secrets
psql-userdb="host=postgres port=5432 dbname=turncred user=turncred password=turncred connect_timeout=10"
userdb-user-secret-query="SELECT value FROM turn_secret WHERE realm = $1 AND (valid_until IS NULL OR valid_until > NOW())"

no-cli
no-tlsv1
no-tlsv1_1

log-file=stdout
verbose
